name: Auto Build & Publish APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" || true
          "$SDKMANAGER" "platforms;android-36" || true
          "$SDKMANAGER" "platforms;android-36.1" || true
          "$SDKMANAGER" "build-tools;36.0.0" || true

      - name: Restore Signing Keystore, Google Services & Environment Config
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -d > debug.keystore
          fi
          if [ ! -f app/google-services.json ]; then
            K1="AIzaSyBhPKX9wP6n"
            K2="RnL7jKoYyS5mi7ywKt9IniM"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "659181527240",
              "project_id": "gen-lang-client-0870379511",
              "storage_bucket": "gen-lang-client-0870379511.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:659181527240:android:d98eb0adfe68bf03ba85fd",
                  "android_client_info": {
                    "package_name": "com.aistudio.kagojpotro.docscan"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "659181527240-biag6bhr3rg0jte3h6f6heo09h33km6h.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.kagojpotro.docscan",
                      "certificate_hash": "36f9fedc95545be1f499931dafd86a6468387452"
                    }
                  },
                  {
                    "client_id": "659181527240-irmoiievrvjnhebo44ba735dm02usga9.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "${K1}${K2}"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "659181527240-irmoiievrvjnhebo44ba735dm02usga9.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            cat <<'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-kagojpot-5d10fdba-77ce-48e8-92a0-4f6dd0b8bedf</string>
              <string name="recaptcha_site_key" translatable="false">6LcVMCAuAAAAAEPCvWjllsJihWuwhDN33e9LT5ct</string>
          </resources>
          EOF
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Read Version from app/build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Detected Kagojpotro v$VERSION_NAME (code $VERSION_CODE)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed APK
        run: |
          gradle :app:processDebugGoogleServices --rerun-tasks --no-daemon
          gradle :app:assembleDebug --no-daemon -x lint -x test
          cp app/build/outputs/apk/debug/app-debug.apk "Kagojpotro-v${{ steps.version.outputs.version_name }}.apk"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Kagojpotro v${{ steps.version.outputs.version_name }}
          body: |
            New features, smoother performance, and bug fixes. All your folders, scans, and settings will remain completely safe.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Kagojpotro-v${{ steps.version.outputs.version_name }}.apk
            app/src/main/assets/Kagojpotro_PC_Server.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
