name: Auto Build & Publish APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" || true
          "$SDKMANAGER" "platforms;android-36" || true
          "$SDKMANAGER" "platforms;android-36.1" || true
          "$SDKMANAGER" "build-tools;36.0.0" || true

      - name: Restore Signing Keystore & Environment Config
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Read Version from app/build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Detected Kagojpotro v$VERSION_NAME (code $VERSION_CODE)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed APK
        run: |
          gradle :app:assembleDebug --no-daemon -x lint -x test
          cp app/build/outputs/apk/debug/app-debug.apk "Kagojpotro-v${{ steps.version.outputs.version_name }}.apk"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Kagojpotro v${{ steps.version.outputs.version_name }}
          body: |
            ### Kagojpotro v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
            - Download **`Kagojpotro-v${{ steps.version.outputs.version_name }}.apk`** below to install or update the Android app.
            - Existing users can also update directly inside the app via **Settings → Update → Check for update**.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Kagojpotro-v${{ steps.version.outputs.version_name }}.apk
            app/src/main/assets/Kagojpotro_PC_Server.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
